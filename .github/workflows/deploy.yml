name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies & Build with GitHub Secrets
        env:
          VITE_ADMIN_USER: ${{ secrets.ADMIN_USERNAME || secrets.VITE_ADMIN_USER || 'suraj' }}
          VITE_ADMIN_PASS: ${{ secrets.ADMIN_PASSWORD || secrets.VITE_ADMIN_PASS || 'birla@2026' }}
        run: |
          cd frontend
          npm ci
          npm run build
          # Deploy built files to docs directory for GitHub Pages
          rm -rf ../docs/*
          cp -r dist/* ../docs/
          # Ensure 404.html exists for SPA client-side routing on GitHub Pages
          cp dist/index.html ../docs/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
